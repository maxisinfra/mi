<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MICS</title>
<meta name="description" content="MICS: vendor and project desk">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MICS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F3EF;--surf:#FFFFFF;--ink:#141414;--mut:#66665F;--line:#E0E0D9;
  --acc:#0E7A3D;--acc-ink:#FFFFFF;--acc-soft:#E3F2E9;
  --dang:#B42318;--dang-soft:#FBE9E7;--warn:#8A5A00;--warn-soft:#FBF0D9;
  --t1:#2C3E48;--t1-ink:#FFFFFF;--t2:#0E7A3D;--t2-ink:#FFFFFF;
  --r:16px;--r-lg:24px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F100F;--surf:#1A1C1A;--ink:#F1F1EC;--mut:#A0A099;--line:#2C2F2C;
  --acc:#3DBE74;--acc-ink:#05210F;--acc-soft:#16301F;
  --dang:#FF8A7E;--dang-soft:#3A1B18;--warn:#F2C26B;--warn-soft:#352A12;
  --t1:#2C3E48;--t1-ink:#FFFFFF;--t2:#155C36;--t2-ink:#FFFFFF;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg{display:block;flex:none}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;min-height:72px}
.bar h1{font-size:24px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.ibtn{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);flex:none}
.ibtn:active{background:var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{flex:none;width:60px;height:60px;border-radius:14px;border:1px solid var(--line)}
.brand b{flex:none;font-size:28px;letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dot.off{background:var(--mut)}.dot.sync{background:var(--warn)}.dot.err{background:var(--dang)}

/* page */
.page{width:100%;max-width:720px;margin:0 auto;padding:4px 20px calc(28px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}
.page>*{min-width:0}
.foot{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:12px}
.sec{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.note{font-size:14.5px;color:var(--mut)}
.err{font-size:14px;color:var(--dang);font-weight:600;overflow-wrap:anywhere}

/* big tiles */
.tiles{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.big{flex:1;min-height:200px;border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;background:var(--t1);color:var(--t1-ink);position:relative;overflow:hidden}
.big.two{background:var(--t2);color:var(--t2-ink)}
.big.pro{background:#004A8D;color:#fff}
.big.h{flex:none;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;padding:14px 20px}
.big.h h2{font-size:26px}
.big.h p{font-size:15px}
.big .ic.img{background:none;padding:0;border-radius:0;overflow:visible}
.big.h .ic{width:76px;height:76px}
.big.light{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.big .ic{width:76px;height:76px;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.16);display:grid;place-items:center}
.big.light .ic{background:var(--acc-soft);color:var(--acc)}
.big h2{font-size:32px;line-height:1.1;letter-spacing:-.02em}
.big p{font-size:17px;opacity:.8;margin-top:4px}
.big:active{transform:scale(.99)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:18px;min-height:156px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tile .ic{width:54px;height:54px;border-radius:16px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.tile b{font-size:18px;display:block;line-height:1.2}
.tile small{font-size:14.5px;color:var(--mut);display:block;margin-top:2px}
.tile.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tile.acc .ic{background:rgba(255,255,255,.22);color:inherit}
.tile.acc small{color:inherit;opacity:.8}
.tile.danger .ic{background:var(--dang-soft);color:var(--dang)}
.tile.sm{min-height:112px;padding:14px;gap:8px;border-radius:18px}
.tile.sm .ic{width:44px;height:44px;border-radius:14px}
.tile.sm b{font-size:16px}
.tile.sm small{font-size:13px}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.tile.wide{min-height:0;flex-direction:row;align-items:center}
.tile.wide>div{flex:1;min-width:0}

/* cards and lists */
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;min-width:0}
.card.tap{cursor:pointer}.card.tap:active{background:var(--line)}
.card .main{flex:1;min-width:0}
.card .t{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.card .s{font-size:15px;color:var(--mut);overflow-wrap:anywhere}
.code{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:8px;background:var(--acc-soft);color:var(--acc);margin-bottom:4px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--mut);margin-left:6px;vertical-align:middle}
.pill.ok{background:var(--acc-soft);color:var(--acc)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--dang-soft);color:var(--dang)}
.acts{display:flex;gap:8px;flex:none}
.act{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);border:0}
.act.wa{background:#DDF5E6;color:#0A7A3A}
.act.off{opacity:.35;pointer-events:none}
.act.dang{background:var(--dang-soft);color:var(--dang)}
.banner{border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;background:var(--acc-soft);color:var(--acc);display:flex;gap:10px;align-items:center}
.banner.dang{background:var(--dang-soft);color:var(--dang)}
.empty{text-align:center;color:var(--mut);padding:32px 16px}

/* forms */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:15px;font-weight:600;color:var(--mut)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;font-size:17px;padding:15px 16px;min-height:54px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.chk input{width:28px;height:28px;margin-top:1px;accent-color:var(--acc);flex:none}
.chk span{min-width:0;overflow-wrap:anywhere}
.chk small{display:block;color:var(--mut);font-size:13px}
.btn{min-height:58px;padding:14px 20px;font-size:17px;border-radius:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surf);border:1px solid var(--line);text-align:center;flex:1}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.dang{background:var(--dang-soft);color:var(--dang);border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:46px;padding:10px 16px;font-size:15px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cp{padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:600;font-size:16px}
.cp.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.cp.dang.on{background:var(--dang);border-color:var(--dang);color:#fff}
.docrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.docrow:first-child{border-top:0}
.docrow .main{flex:1;min-width:0}
.docrow .t{overflow-wrap:anywhere;font-weight:600;font-size:16px}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kv .v{overflow-wrap:anywhere;white-space:pre-wrap}
.callrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.callrow .btn{flex:none;flex-direction:column;gap:4px;min-height:80px;font-size:16px}
.callrow .btn.off{opacity:.4;pointer-events:none}
details.pv summary{font-weight:700;cursor:pointer;padding:4px 0}
details.pv pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px}
.pick{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.pick:first-child{border-top:0}
.pick input{width:28px;height:28px;accent-color:var(--acc);flex:none}
.pick .main{flex:1;min-width:0}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surf);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.sheet h3{font-size:22px}
.sheet .row{display:flex;gap:12px}
.lightbox{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.lightbox .top{display:flex;gap:12px;justify-content:flex-end;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.lightbox img{flex:1;min-height:0;width:100%;object-fit:contain}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* login / splash */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center}
.center img{width:96px;height:96px;border-radius:24px;border:1px solid var(--line)}
.center h1{font-size:34px;letter-spacing:.08em}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;min-height:52px;border-radius:14px;background:#fff;color:#1F1F1F;border:1px solid #DADCE0;font-weight:700}
.gbtn[disabled]{opacity:.6;pointer-events:none}
@media (min-width:700px){.big{min-height:240px}}
@media (max-width:359px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.callrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';

/* ================= basics ================= */
function okCfg(c){return c&&c.apiKey&&c.projectId&&String(c.apiKey).indexOf('PASTE')<0&&String(c.projectId).indexOf('PASTE')<0?c:null;}
var SAVED=null;try{SAVED=JSON.parse(localStorage.getItem('mics_cfg')||'null');}catch(e){}
var CFG=okCfg(SAVED)||okCfg(window.MICS_FIREBASE);
var COLLS=['vendors','projects','log','meta'];
var S={vendors:[],projects:[],log:[],meta:[],user:null,authKnown:false,ready:false,pending:false,online:navigator.onLine!==false,sdkFail:false,err:'',mode:CFG?'cloud':'local'};
var B=null;           /* storage backend (local or cloud) */
var EDIT=false;       /* true while a form/share screen is open: live updates must not redraw it */
var SH=null;          /* share screen state */
var $app=document.getElementById('app');
var deferredInstall=null;

var DOC_LABELS=['Quotation','Work order','Invoice','GST certificate','PAN card','Agreement','Insurance','Licence','Drawing','BOQ','Site photo','Other'];
var ACCEPT='image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.dwg,.dxf,.zip';
var VCATS=['Civil contractor','Electrical','Plumbing and sanitary','Steel / TMT supplier','Cement and RMC','Earthwork and excavation','Machinery rental','Labour contractor','Interior and finishing','Architect / consultant','Other'];
var SRC_TYPES=['Not set','Client (direct)','Existing client','Contractor','Consultant','Architect','Broker / agent','Friend / reference','Other'];
var REASONS=['Project gone','Expired','Deal done'];
var ICONS={
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  clip:'<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  more:'<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};

function h(tag,a){
  var e=document.createElement(tag);a=a||{};
  for(var k in a){var v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected'||k==='multiple')e[k]=v;
    else if(k==='text')e.textContent=v;
    else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.appendChild(c.nodeType?c:document.createTextNode(String(c)));
}
function iconImg(file,fallback,s){
  var w=document.createElement('span');w.style.cssText='display:inline-flex;width:100%;height:100%;align-items:center;justify-content:center';
  var im=new Image();im.alt='';im.style.cssText='width:100%;height:100%;object-fit:contain';
  im.onerror=function(){w.replaceChildren(icon(fallback,s));};im.src=file;w.appendChild(im);return w;}
function icon(n,s){var d=document.createElement('span');d.style.display='inline-flex';d.innerHTML='<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';return d;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function digits(s){return String(s||'').replace(/\D/g,'');}
function waNum(p){var raw=String(p||'').trim(),d=digits(raw);if(raw.charAt(0)==='+')return d;if(d.length===10)return '91'+d;if(d.length===11&&d.charAt(0)==='0')return '91'+d.slice(1);return d;}
function telHref(p){var raw=String(p||'').trim(),d=digits(raw);if(raw.charAt(0)==='+')return 'tel:+'+d;if(d.length===10)return 'tel:+91'+d;if(d.length===11&&d.charAt(0)==='0')return 'tel:+91'+d.slice(1);if(d.length===12&&d.indexOf('91')===0)return 'tel:+'+d;return 'tel:'+d;}
function waHref(v,text){return 'https://wa.me/'+waNum(v.waPhone||v.phone)+(text?'?text='+encodeURIComponent(text):'');}
function who(v){return v.contact||v.name;}
function fmtDay(s){if(!s)return '';var d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtAt(t){return t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN');}
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function codeNum(c){var m=/(\d+)$/.exec(String(c||''));return m?Number(m[1]):0;}
function nextVNum(){var m=500;S.vendors.forEach(function(v){var n=codeNum(v.code||v.id);if(n>m)m=n;});return m+1;}
function nextPNum(){var m=100;S.projects.forEach(function(p){var n=codeNum(p.code||p.id);if(n>m)m=n;});return m+1;}
function byId(id){for(var i=0;i<S.vendors.length;i++)if(S.vendors[i].id===id)return S.vendors[i];return null;}
function byPid(id){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id)return S.projects[i];return null;}
function myName(){for(var i=0;i<S.meta.length;i++)if(S.meta[i].id==='profile')return S.meta[i].name||'';return '';}
function valCr(p){
  if(p.valueCr!==''&&p.valueCr!=null&&isFinite(Number(p.valueCr)))return Number(p.valueCr);
  if(p.value!==''&&p.value!=null&&isFinite(Number(p.value)))return Number(p.value)/1e7;
  return null;
}
function trimN(n,d){return String(+Number(n).toFixed(d));}
function fmtCr(n){return n>=0.01||n===0?'₹'+trimN(n,4)+' Cr':rupeesWords(n*1e7);}
function rupeesWords(r){
  if(r>=1e7)return '₹'+trimN(r/1e7,2)+' Cr';
  if(r>=1e5)return '₹'+trimN(r/1e5,2)+' Lakh';
  return inr(Math.round(r));
}
function feeAmount(p){
  var v=valCr(p),n=Number(p.fee);
  if((p.feeBasis||'')!=='Percentage of project cost'||v==null||!isFinite(n)||n<=0)return null;
  return v*1e7*n/100;
}
function feeText(p){
  if(p.fee===''||p.fee==null)return '';
  var n=Number(p.fee);if(!isFinite(n)||n<=0)return '';
  var b=p.feeBasis||'Fixed fee';
  if(b==='Percentage of project cost'){var a=feeAmount(p);return n+'% of project cost'+(a!=null?', about '+rupeesWords(a):'');}
  if(b==='Monthly retainer')return inr(n)+' per month';
  if(b==='Per site visit')return inr(n)+' per site visit';
  return inr(n)+' fixed fee';
}

function niceErr(e){

  if(c==='auth/unauthorized-domain')return 'This web address is not allowed for sign-in yet. Add it under Firebase > Authentication > Settings > Authorized domains.';
  if(c==='auth/network-request-failed')return 'No internet connection. Connect and try again.';
  if(c==='auth/popup-blocked')return 'The sign-in window was blocked. Allow pop-ups for this site and try again.';
  return (e&&e.message)?String(e.message):'Something went wrong. Try again.';

function download(name,blob){

    if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){navigator.share({files:[f],title:name}).catch(function(){});return;}
  }catch(e){}
  var u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},60000);

/* ================= storage: this phone only ================= */
function localBackend(){
  var dbp=null;
  function open(){
    if(!dbp)dbp=new Promise(function(res,rej){
      var r=indexedDB.open('mics',1);
      r.onupgradeneeded=function(){var d=r.result;COLLS.concat(['files']).forEach(function(s){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
      r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
    });
    return dbp;
  }
  function tx(store,mode,fn){return open().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction(store,mode),r=fn(t.objectStore(store));
    t.oncomplete=function(){res(r&&r.result);};t.onerror=t.onabort=function(){rej(t.error);};});});}
  return {
    maxBytes:30*1024*1024,
    init:function(){return Promise.all(COLLS.map(function(c){return tx(c,'readonly',function(s){return s.getAll();}).then(function(a){S[c]=a||[];});}));},
    put:function(c,o){return tx(c,'readwrite',function(s){return s.put(o);});},
    del:function(c,id){return tx(c,'readwrite',function(s){return s['delete'](id);});},
    putFile:function(id,blob){return blob.arrayBuffer().then(function(buf){return tx('files','readwrite',function(s){return s.put({id:id,type:blob.type,buf:buf});});}).then(function(){return 1;});},
    getFile:function(d){return tx('files','readonly',function(s){return s.get(d.id);}).then(function(r){if(!r)throw new Error('This file is not on this phone.');return new Blob([r.buf],{type:r.type||d.type});});},
    delFile:function(d){return tx('files','readwrite',function(s){return s['delete'](d.id);});},
    signOut:function(){return Promise.resolve();}
  };
}

/* ================= storage: Google account (Firebase) ================= */
var fb=null,auth=null,fs=null,base=null,unsubs=[];
var CH=800000;
function clean(o){return JSON.parse(JSON.stringify(o));}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
function cloudBackend(){
  return {
    maxBytes:10*1024*1024,
    init:function(){
      base=fs.collection('users').doc(S.user.uid);
      var left=COLLS.length;
      return new Promise(function(res){
        var timer=setTimeout(res,6000);
        COLLS.forEach(function(c){
          var first=true;
          unsubs.push(base.collection(c).onSnapshot({includeMetadataChanges:true},function(snap){
            S[c]=snap.docs.map(function(d){return d.data();});
            S.pending=snap.metadata.hasPendingWrites;S.err='';
            if(first){first=false;if(--left===0){clearTimeout(timer);res();}}
            else{S.ready=true;refresh();}
          },function(e){
            S.err=niceErr(e);
            if(first){first=false;if(--left===0){clearTimeout(timer);res();}}
            refresh();
          }));
        });
      });
    },
    put:function(c,o){return base.collection(c).doc(o.id).set(clean(o));},
    del:function(c,id){return base.collection(c).doc(id)['delete']();},
    putFile:function(id,blob){
      return blob.arrayBuffer().then(function(buf){
        var u8=new Uint8Array(buf),n=Math.max(1,Math.ceil(u8.length/CH)),sets=[];
        for(var i=0;i<n;i++){
          sets.push(base.collection('files').doc(id+'_'+i).set({fid:id,i:i,data:fb.firestore.Blob.fromUint8Array(u8.slice(i*CH,(i+1)*CH))}));
        }
        var all=Promise.all(sets);
        /* offline: the writes stay queued and upload later, so do not wait for them */
        return (navigator.onLine===false?Promise.resolve():Promise.race([all,delay(120000)])).then(function(){return n;});
      });
    },
    getFile:function(d){
      var n=d.chunks||1,jobs=[];
      for(var i=0;i<n;i++)jobs.push(base.collection('files').doc(d.id+'_'+i).get());
      return Promise.all(jobs).then(function(snaps){
        var parts=snaps.map(function(s){if(!s.exists)throw new Error('This file is not available yet. Open it once while online.');return s.data().data.toUint8Array();});
        return new Blob(parts,{type:d.type||'application/octet-stream'});
      });
    },
    delFile:function(d){
      var n=d.chunks||1,jobs=[];
      for(var i=0;i<n;i++)jobs.push(base.collection('files').doc(d.id+'_'+i)['delete']());
      return navigator.onLine===false?Promise.resolve():Promise.race([Promise.all(jobs),delay(15000)]);
    },
    signOut:function(){unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];COLLS.forEach(function(c){S[c]=[];});S.ready=false;return auth.signOut();}
  };
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src));};document.head.appendChild(s);});}
var SDK='https://www.gstatic.com/firebasejs/10.14.1/';
function startCloud(){
  S.sdkFail=false;
  var chain=window.firebase&&window.firebase.firestore?Promise.resolve():loadScript(SDK+'firebase-app-compat.js').then(function(){return loadScript(SDK+'firebase-auth-compat.js');}).then(function(){return loadScript(SDK+'firebase-firestore-compat.js');});
  return chain.then(function(){
    fb=window.firebase;
    if(!fb.apps.length)fb.initializeApp(CFG);
    auth=fb.auth();fs=fb.firestore();
    try{fs.settings({ignoreUndefinedProperties:true,cacheSizeBytes:fb.firestore.CACHE_SIZE_UNLIMITED});}catch(e){}
    try{fs.enablePersistence({synchronizeTabs:true})['catch'](function(){});}catch(e){}
    auth.getRedirectResult()['catch'](function(e){S.err=niceErr(e);render();});
    auth.onAuthStateChanged(onUser);
  })['catch'](function(){S.sdkFail=true;S.authKnown=true;render();});

function onUser(u){

function signIn(btn){

    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    S.err=niceErr(e);
  }).then(function(){if(btn)btn.disabled=false;render();});

function save(coll,obj){
  var arr=S[coll],i=-1;
  for(var k=0;k<arr.length;k++)if(arr[k].id===obj.id){i=k;break;}
  if(i>=0)arr[i]=obj;else arr.push(obj);
  var p;try{p=B.put(coll,obj);}catch(e){toast(niceErr(e));return Promise.reject(e);}
  if(p&&p.catch)p['catch'](function(e){toast(niceErr(e));});
  return p||Promise.resolve();
}
function remove(coll,id){
  S[coll]=S[coll].filter(function(x){return x.id!==id;});
  var p;try{p=B.del(coll,id);}catch(e){toast(niceErr(e));return Promise.resolve();}
  if(p&&p.catch)p['catch'](function(e){toast(niceErr(e));});
  return p||Promise.resolve();
}
function shrinkImage(file){
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)/.test(file.type)||file.size<900000){res(file);return;}
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var m=1800,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b&&b.size<file.size?b:file);},'image/jpeg',.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};img.src=url;
  });
}
function commitDocs(ds,onProg){
  /* uploads new files, removes dropped ones; returns the final documents list or throws */
  var out=ds.keep.slice(),failed=[],chain=Promise.resolve();
  ds.add.forEach(function(it,idx){chain=chain.then(function(){
    if(onProg)onProg('Uploading '+(idx+1)+' of '+ds.add.length+'…');
    return shrinkImage(it.file).then(function(blob){
      if(blob.size>B.maxBytes){failed.push(it.file.name+' (over '+Math.round(B.maxBytes/1048576)+' MB)');return;}
      var id=uid();
      return B.putFile(id,blob).then(function(n){out.push({id:id,name:it.file.name,label:it.label,size:blob.size,type:blob.type||it.file.type||'application/octet-stream',chunks:n,addedAt:Date.now()});},function(){failed.push(it.file.name);});
    });
  });});
  return chain.then(function(){
    if(failed.length){var e=new Error('Could not attach: '+failed.join(', ')+'. Remove it or try again.');e.docs=out;throw e;}
    ds.rm.forEach(function(d){try{B.delFile(d)['catch'](function(){});}catch(e){}});
    return out;
  });
}

    if(S.mode==='cloud'&&!S.user)out=S.sdkFail?vFail():(S.authKnown?vLogin():vSplash());

function parseCsv(text){
  var rows=[],row=[],cur='',q=false;text=text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!=='';}))rows.push(row);row=[];}
    else cur+=c;}
